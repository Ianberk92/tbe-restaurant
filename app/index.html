<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>REdine · RE+ 2026 Dining Holds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/png" href="brand/terabase-mark.png">
<!-- Home-screen app: icon, browser-bar color, standalone launch -->
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#1B3359">
<meta name="apple-mobile-web-app-title" content="REdine">
<style>
/* Layout: show-floor signage header, summary strip, tabbed views; cards on phone, table for the full list */
:root{
  /* Terabase Brand Guidelines (2023): Primary navy #1B3359, secondary blue #086EC1, accents light blue #50B8E2,
     orange #F75200, amber #FE9E2F, green #67B218, grays #4D5454 / #222525. Text tokens are darker (light) or lighter (dark)
     shades of the brand colors so every text pair meets WCAG AA 4.5:1; raw brand colors are used for dots, borders and fills. */
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#EAEAEA; --fg:#222525; --muted:#4D5454; --line:#D8D9D9;
  --ink:#1B3359; --ink-fg:#FFFFFF; --ink-accent:#50B8E2; --accent:#F75200; --accent-fg:#222525; --accent-soft:#E3F4FA;
  --hold:#90622A; --hold-dot:#FE9E2F; --hold-bg:#FFEFDE; --ok:#48731E; --ok-dot:#67B218; --ok-bg:#EAF4DF;
  --off:#4D5454; --off-dot:#828787; --off-bg:#EAEAEA; --bad:#AC420D; --bad-dot:#F75200; --bad-bg:#FEEAE0;
  --info:#086EC1; --info-dot:#086EC1; --info-bg:#E6F0F9;
  --f-display:"Inter",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222525; --surface:#2E3232; --surface-2:#353A3A; --fg:#F6F6F6; --muted:#CDCFCF; --line:#404646;
  --ink:#1B3359; --ink-fg:#FFFFFF; --ink-accent:#50B8E2; --accent:#F75200; --accent-fg:#222525; --accent-soft:#354F59;
  --hold:#FEAD4E; --hold-dot:#FE9E2F; --hold-bg:#584831; --ok:#95C95D; --ok-dot:#67B218; --ok-bg:#394C2D;
  --off:#CACCCC; --off-dot:#9DA1A1; --off-bg:#3D4343; --bad:#FA9766; --bad-dot:#F75200; --bad-bg:#4E372A;
  --info:#84CDEB; --info-dot:#50B8E2; --info-bg:#354D55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#222525; --surface:#2E3232; --surface-2:#353A3A; --fg:#F6F6F6; --muted:#CDCFCF; --line:#404646;
  --ink:#1B3359; --ink-fg:#FFFFFF; --ink-accent:#50B8E2; --accent:#F75200; --accent-fg:#222525; --accent-soft:#354F59;
  --hold:#FEAD4E; --hold-dot:#FE9E2F; --hold-bg:#584831; --ok:#95C95D; --ok-dot:#67B218; --ok-bg:#394C2D;
  --off:#CACCCC; --off-dot:#9DA1A1; --off-bg:#3D4343; --bad:#FA9766; --bad-dot:#F75200; --bad-bg:#4E372A;
  --info:#84CDEB; --info-dot:#50B8E2; --info-bg:#354D55; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{background:var(--ink);color:var(--ink-fg)}
header.top .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.logo{display:block;height:28px;width:auto;margin-bottom:8px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1;margin:0;letter-spacing:-.02em}
.role{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink-fg) 30%,transparent);white-space:nowrap}
.role b{color:var(--ink-accent)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px}
.stat{background:var(--surface);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.stat.alert .n{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface-2);padding:4px;border-radius:9px}
.tab{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--f-body)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;padding:8px 14px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{font-size:13px;padding:5px 10px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.day{margin-bottom:22px}
.dayhead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:4px;margin-bottom:10px}
.dayhead h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
.dayhead span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.is-released,.card.is-cancelled{opacity:.62}
.card .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.time{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.meal{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
.rname{font-weight:700;font-size:16px;line-height:1.25}
.loc{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot,currentColor)}
.st-Hold{color:var(--hold);background:var(--hold-bg);--dot:var(--hold-dot)}
.st-Confirmed{color:var(--ok);background:var(--ok-bg);--dot:var(--ok-dot)}
.st-Released{color:var(--off);background:var(--off-bg);--dot:var(--off-dot)}
.st-Cancelled{color:var(--bad);background:var(--bad-bg);--dot:var(--bad-dot)}
.bk-Reservable{color:var(--ok);background:var(--ok-bg);--dot:var(--ok-dot)}
.bk-Walk-in{color:var(--info);background:var(--info-bg);--dot:var(--info-dot)}
.bk-Unconfirmed{color:var(--hold);background:var(--hold-bg);--dot:var(--hold-dot)}
.flags{display:flex;flex-direction:column;gap:4px}
.flag{font-size:12.5px;font-weight:600;padding:5px 8px;border-radius:6px;border-left:3px solid currentColor}
.flag.bad{color:var(--bad);background:var(--bad-bg);border-left-color:var(--bad-dot)}
.flag.warn{color:var(--hold);background:var(--hold-bg);border-left-color:var(--hold-dot)}
.cardfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.cardfoot select{font-size:13px;padding:4px 6px}
a{color:var(--info)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px;color:var(--muted)}
.empty strong{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h3{font-family:var(--f-display);font-size:22px;margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field.wide{grid-column:1/-1}
textarea{min-height:60px;resize:vertical}
.formfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--bad)}
.near{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.near .card .watch{font-size:13px;color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:70ch}
.fits{display:flex;flex-wrap:wrap;gap:4px}
.fit{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.bk-Grab-and-go{color:var(--off);background:var(--off-bg);--dot:var(--off-dot)}
.areachip{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.sumline{margin-top:16px;font-size:14px}
.sumline:empty{display:none}
.sumline .attn{display:inline-flex;gap:8px;align-items:center;font:600 14px var(--f-body);color:var(--bad);background:var(--bad-bg);border:0;border-left:3px solid var(--bad-dot);border-radius:6px;padding:8px 12px;cursor:pointer}
.sumline .attn:hover{text-decoration:underline}
.sumline{display:flex;flex-wrap:wrap;gap:8px}
.sumline .upd{display:inline-flex;align-items:center;font:600 14px var(--f-body);color:var(--info);background:var(--info-bg);border:0;border-left:3px solid var(--info-dot);border-radius:6px;padding:8px 12px;text-align:left}
.sumline button.upd{cursor:pointer}
.sumline button.upd:hover{text-decoration:underline}
.nearbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segb{border:0;background:var(--surface);color:var(--muted);font:600 14px var(--f-body);padding:7px 14px;cursor:pointer}
.segb+.segb{border-left:1px solid var(--line)}
.segb[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.segb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lead{color:var(--muted);font-size:14px;margin:0 0 12px}
.ncard{gap:6px}
.eta{font-size:14px}
.eta b{font-family:var(--f-display);font-size:20px;font-weight:600}
.watch{font-size:13px;color:var(--muted);font-style:italic}
details.more summary{cursor:pointer;font-size:13px;color:var(--info);width:max-content}
.moreb{display:grid;gap:4px;font-size:13px;margin-top:6px}
.k{display:inline-block;min-width:92px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.card:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
/* Restaurant form: meal checkboxes */
fieldset.checks{border:0;padding:0;margin:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:flex-start}
fieldset.checks legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0;margin-bottom:4px;width:100%}
fieldset.checks label{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:500;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer}
fieldset.checks input{width:auto;padding:0;accent-color:var(--accent)}
.formfoot .spacer{flex:1}
/* Simplified booking form */
.hint{font-size:13px;color:var(--muted);min-height:1em}
fieldset.days{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:440px}
fieldset.days legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0;margin-bottom:4px;width:100%}
.dayb{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 4px;border-radius:7px;cursor:pointer;min-width:0}
.dayb small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dayb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.dayb[aria-pressed="true"] small{color:var(--ink-accent)}
.dayb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.moreform{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
details.moreform>summary{cursor:pointer;font-weight:600;color:var(--info);width:max-content}
details.moreform>.grid{margin-top:12px}
/* Bookings toolbar */
.bkbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:auto;padding:0;accent-color:var(--accent)}
/* Simplified restaurant card: name, minutes, one badge, Book / Call / Map */
.ncard .big{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ncard .big small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.ncard .acts{display:flex;flex-wrap:wrap;gap:6px}
.ncard .acts .btn{text-decoration:none;display:inline-flex;align-items:center}
.ncard .acts .btn.primary{color:var(--accent-fg)}
.ncard .areachip{margin-right:6px}
/* Breakfast: grouped by hotel */
.hotel{margin-bottom:18px}
.hotelh{font-family:var(--f-display);font-weight:600;font-size:19px;margin:6px 0 8px;letter-spacing:-.01em}
.hotelh span{font-weight:500;font-size:14px;color:var(--muted)}
.ncard .hours{font-size:13.5px}
.areatip{font-size:13.5px;color:var(--muted);margin:-4px 0 10px;max-width:75ch}
.hotelh .f1tag{color:var(--hold);font-weight:600}
/* ---------- Phones ---------- */
/* Keep content clear of the iPhone notch / rounded corners in landscape */
.wrap{padding-inline:max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right))}
/* Touch screens: finger-sized targets (~44px) */
@media (pointer:coarse){
  .btn,.tab,.segb,.dayb{min-height:44px}
  .btn.sm{min-height:40px;padding:8px 12px}
  .ncard .acts .btn{min-width:64px;justify-content:center}
  .toggle{min-height:44px}
  .toggle input,fieldset.checks input{width:20px;height:20px}
  details.more>summary,details.moreform>summary{padding:10px 0}
  .rname.link{padding:4px 0}
  .sumline .attn,.sumline .upd{min-height:44px}
  select,input:not([type=checkbox]){min-height:44px}
  a.btn{display:inline-flex;align-items:center}
}
/* 16px text in fields stops iOS Safari zooming in when a field is tapped */
@media (pointer:coarse),(max-width:640px){
  input,select,textarea,.cardfoot select{font-size:16px}
}
/* Small phones: meal buttons share the full width instead of overflowing */
@media (max-width:480px){
  .nearbar .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
  .nearbar .segb{padding-inline:4px}
  .nearbar .segb+.segb{border-left:1px solid var(--line)}
  dialog#mapDlg{padding:12px}
}
.rname.link{background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:16px;color:var(--fg);text-align:left;cursor:pointer}
.rname.link:hover{text-decoration:underline}
.rname.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Today view: when to leave the booth */
.leave{font-size:14px;background:var(--info-bg);color:var(--info);border-radius:6px;padding:6px 10px}
.leave b{font-size:16px}
/* Map popup */
dialog#mapDlg{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px);border:0;border-radius:12px;padding:16px;background:var(--surface);color:var(--fg);box-shadow:0 8px 32px rgba(0,0,0,.35)}
dialog#mapDlg::backdrop{background:rgba(24,24,24,.5)}
.dlghead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.dlghead h3{font-family:var(--f-display);font-size:20px;margin:0;font-weight:600}
#mapFrame{display:block;width:100%;height:min(60vh,460px);border:1px solid var(--line);border-radius:8px;margin:10px 0 8px;background:var(--surface-2)}
</style>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}.signout{color:inherit}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <img class="logo" src="brand/terabase-logo-white.png" alt="Terabase" height="30" data-brand>
      <h1>REdine</h1>
    </div>
    <div class="role" id="role">Loading…</div>
  </div>
</header>

<main class="wrap">
  <div class="sumline" id="summary" aria-live="polite"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="nearby" aria-selected="true">Places</button>
      <button class="tab" role="tab" data-tab="bookings" aria-selected="false">Bookings</button>
    </div>
    <div class="actions">
      <button class="btn" id="exportBtn" hidden>Export CSV</button>
      <button class="btn primary" id="addBtn" hidden>+ Add booking</button>
    </div>
  </div>

  <section class="panel" id="formPanel" hidden aria-labelledby="formTitle">
    <h3 id="formTitle">Add booking</h3>
    <form id="resForm" autocomplete="off">
      <!-- The five things needed to log a booking; everything else is under "More details" -->
      <div class="grid">
        <div class="field wide"><label for="f_restaurant">Restaurant</label><input id="f_restaurant" list="placeList" required placeholder="Start typing, or pick from the list"><span class="hint" id="f_placeHint"></span></div>
        <fieldset class="field wide days" id="f_days"><legend>Day</legend></fieldset>
        <div class="field"><label for="f_time">Time</label><input type="time" id="f_time" required></div>
        <div class="field"><label for="f_party">Party size</label><input id="f_party" type="number" min="1" step="1" inputmode="numeric"></div>
        <div class="field"><label for="f_host">Host</label><input id="f_host" list="hostList" required></div>
      </div>
      <details class="moreform" id="f_more">
        <summary>More details <span class="msg" id="f_moreCount"></span></summary>
        <div class="grid">
          <div class="field"><label for="f_status">Status</label><select id="f_status"><option>Hold</option><option>Confirmed</option><option>Cancelled</option></select></div>
          <div class="field"><label for="f_conf">Confirmation #</label><input id="f_conf"></div>
          <div class="field"><label for="f_cancelBy">Cancel-by deadline</label><input id="f_cancelBy" type="datetime-local"></div>
          <div class="field"><label for="f_fee">No-show / late-cancel fee</label><input id="f_fee" placeholder="e.g. $50 pp"></div>
          <div class="field"><label for="f_company">Guest company</label><input id="f_company"></div>
          <div class="field"><label for="f_purpose">Purpose</label><select id="f_purpose"><option value="">—</option><option>Customer</option><option>Partner</option><option>Investor</option><option>Internal</option></select></div>
          <div class="field wide"><label for="f_attendees">Attendees (internal + guests)</label><input id="f_attendees" placeholder="Names, comma-separated"></div>
          <div class="field"><label for="f_bookedUnder">Booked under (name / phone)</label><input id="f_bookedUnder"></div>
          <div class="field"><label for="f_platform">Booked via</label><select id="f_platform"><option value="">—</option><option>OpenTable</option><option>Resy</option><option>SevenRooms</option><option>Tock</option><option>Phone / direct</option><option>Hotel concierge</option></select></div>
          <div class="field"><label for="f_deposit">Card guarantee / deposit / min spend</label><input id="f_deposit"></div>
          <div class="field"><label for="f_meal">Meal</label><select id="f_meal"><option value="">Auto (from time)</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Drinks</option></select></div>
          <div class="field"><label for="f_date">Other date</label><input type="date" id="f_date" min="2026-11-14" max="2026-11-21"></div>
          <div class="field"><label for="f_area">Area</label><select id="f_area"><option value="">—</option></select></div>
          <div class="field"><label for="f_location">Location / property</label><input id="f_location" placeholder="e.g. Westgate, Floor 1"></div>
          <div class="field"><label for="f_map">Map link</label><input id="f_map" type="url" placeholder="https://maps.app.goo.gl/…"></div>
          <div class="field"><label for="f_travel">Booth-to-table time (min)</label><input id="f_travel" type="number" min="0" step="1"></div>
          <div class="field wide"><label for="f_notes">Notes (dietary, private room, AV)</label><textarea id="f_notes"></textarea></div>
        </div>
      </details>
      <div class="formfoot">
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <span class="msg" id="formMsg" role="status"></span>
      </div>
    </form>
    <datalist id="hostList"></datalist>
    <datalist id="placeList"></datalist>
  </section>

  <section class="panel" id="nearPanel" hidden aria-labelledby="nearTitle">
    <h3 id="nearTitle">Add restaurant</h3>
    <form id="nearForm" autocomplete="off">
      <div class="grid">
        <div class="field"><label for="n_name">Name</label><input id="n_name" required maxlength="120"></div>
        <div class="field"><label for="n_area">Area</label><select id="n_area" required><option value="">—</option></select></div>
        <div class="field"><label for="n_booking">Booking</label><select id="n_booking"><option>Reservable</option><option value="Walk-in">Walk-in only</option><option>Unconfirmed</option><option>Grab-and-go</option></select></div>
        <div class="field"><label for="n_venue">Venue / hotel</label><input id="n_venue" maxlength="120" placeholder="e.g. Westgate, Floor 1"></div>
        <fieldset class="field wide checks" id="n_fit"><legend>Good for (pick at least one)</legend>
          <label><input type="checkbox" value="Breakfast"> Breakfast</label>
          <label><input type="checkbox" value="Lunch"> Lunch</label>
          <label><input type="checkbox" value="Dinner"> Dinner</label>
          <label><input type="checkbox" value="Drinks"> Drinks</label>
        </fieldset>
        <div class="field"><label for="n_total">Minutes from booth (typical)</label><input id="n_total" type="number" min="0" max="240" step="1"></div>
        <div class="field"><label for="n_totalBusy">Minutes when busy</label><input id="n_totalBusy" type="number" min="0" max="240" step="1"></div>
        <div class="field"><label for="n_meals">What they serve</label><input id="n_meals" maxlength="200" placeholder="e.g. Steakhouse, dinner only"></div>
        <div class="field"><label for="n_hours">Hours</label><input id="n_hours" maxlength="300"></div>
        <div class="field"><label for="n_phone">Phone</label><input id="n_phone" type="tel" maxlength="60"></div>
        <div class="field"><label for="n_bookUrl">Booking link</label><input id="n_bookUrl" type="url" maxlength="500" placeholder="https://www.opentable.com/…"></div>
        <div class="field"><label for="n_mapUrl">Map link</label><input id="n_mapUrl" type="url" maxlength="500" placeholder="https://maps.app.goo.gl/…"></div>
        <div class="field wide"><label for="n_bookingNote">Booking notes</label><input id="n_bookingNote" maxlength="400" placeholder="e.g. OpenTable; private room up to 20"></div>
        <div class="field wide"><label for="n_route">How to get there</label><input id="n_route" maxlength="400"></div>
        <div class="field wide"><label for="n_watch">Watch out for</label><input id="n_watch" maxlength="400" placeholder="e.g. Closed Tuesdays"></div>
      </div>
      <div class="formfoot">
        <button type="submit" class="btn primary" id="nearSaveBtn">Save</button>
        <button type="button" class="btn" id="nearCancelBtn">Cancel</button>
        <span class="msg" id="nearMsg" role="status"></span>
        <span class="spacer"></span>
        <button type="button" class="btn danger" id="nearDelBtn" hidden>Remove from list</button>
      </div>
    </form>
  </section>

  <section id="view" aria-live="polite"></section>
</main>
<dialog id="mapDlg" aria-labelledby="mapTitle">
  <div class="dlghead">
    <div><h3 id="mapTitle">Map</h3><div class="msg" id="mapSub"></div></div>
    <button type="button" class="btn sm" id="mapClose">Close</button>
  </div>
  <span class="msg" id="mapRouteLabel">Route from</span>
  <div class="seg" role="group" aria-label="Route from">
    <button type="button" class="segb" data-from="lvcc" aria-pressed="true">Central Hall</button>
    <button type="button" class="segb" data-from="linq" aria-pressed="false">The LINQ</button>
  </div>
  <iframe id="mapFrame" title="Map of the route to the restaurant" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <p class="msg" id="mapNote"></p>
  <a id="mapOpen" class="btn sm" target="_blank" rel="noopener">Open in Google Maps</a>
</dialog>
<script src="app.js" defer></script>
</body>
</html>
