# Deploys the site and API to Azure Static Web Apps on every push to main.
# Pull requests get a private staging URL that is removed when the PR closes.
# Secret needed: AZURE_STATIC_WEB_APPS_API_TOKEN (Static Web App > Manage deployment token).
# Until that secret exists, the workflow still runs the API tests and skips the deploy steps.
name: Deploy RE+ Dining Holds

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]

jobs:
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Test API
        run: cd api && npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used directly in step conditions, so expose a flag instead.
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (Azure not set up yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping deploy. See README step 4."
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          api_location: api
          output_location: ""
          skip_app_build: true

  close_staging:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Close staging environment
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
